/* ── design tokens — lifted verbatim from sidequestsitestandalone.html ── */
:root{
  --base:#07070D; --surface:#10101E; --surface-2:#0A0A14; --hairline:#1E1E30;
  --ink:#EAEDF8; --muted:#8C92AC; --dim:#565C78;
  --violet:#7B6CF0; --violet-soft:#4E47AE; --cyan:#9DD3FF; --hot:#EAF4FF;
  --f-display:'SQDisplay',sans-serif; --f-body:'SQBody',sans-serif; --f-mono:'SQMono',monospace;
}
html,body{margin:0;padding:0;background:var(--base)}
body{font-family:var(--f-body);color:var(--ink);-webkit-font-smoothing:antialiased}
::selection{background:var(--violet-soft);color:var(--hot)}

.eyebrow{display:block;font:700 12px/1 var(--f-mono);letter-spacing:.12em;color:var(--violet);text-transform:uppercase}
.h1{font:700 clamp(2rem,5vw,3.4rem)/1.08 var(--f-display);text-transform:uppercase;color:var(--ink)}
.h2{font:700 clamp(1.8rem,3.2vw,2.6rem)/1.15 var(--f-display);text-transform:uppercase;color:var(--ink)}
.section-label{font:700 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--dim);display:block}

.sq-btn{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;
  font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  padding:11px 24px;border-radius:2px;
  color:var(--ink);background:transparent;border:1px solid rgba(123,108,240,.6);
  transition:background .2s ease,color .2s ease,border-color .2s ease,transform .2s ease,box-shadow .2s ease}
.sq-btn:hover,.sq-btn:focus-visible{
  color:#0A0A12;background:var(--violet);border-color:var(--violet);
  transform:translateY(-2px);box-shadow:0 10px 22px -8px rgba(123,108,240,.75);outline:none}
.sq-btn:active{transform:translateY(0)}
.sq-btn::before,.sq-btn::after{content:"";position:absolute;width:7px;height:7px;border-color:var(--cyan);border-style:solid;transition:border-color .2s ease}
.sq-btn::before{left:-3px;top:-3px;border-width:1.4px 0 0 1.4px}
.sq-btn::after{right:-3px;bottom:-3px;border-width:0 1.4px 1.4px 0}
.sq-btn:hover::before,.sq-btn:hover::after{border-color:var(--hot)}
.sq-btn.secondary{border:1px solid #2c2c48}
.sq-btn.sm{font-size:11px;padding:8px 16px;gap:7px}

.mode-tabs{display:inline-flex;gap:4px;border:1px solid var(--hairline);border-radius:999px;padding:4px}
.mode-tabs button{padding:10px 18px;border-radius:999px;font:400 12px var(--f-mono);text-transform:uppercase;letter-spacing:.04em;color:var(--dim);background:none;border:0;cursor:pointer;transition:background-color .2s,color .2s}
.mode-tabs button.active{background:var(--surface);color:var(--ink)}

.card{position:relative;overflow:hidden;border:1px solid var(--hairline);border-radius:6px;padding:32px;
  background:linear-gradient(180deg,var(--surface),#0C0C16);display:flex;flex-direction:column;gap:14px;
  transition:transform .4s cubic-bezier(.16,1,.3,1),border-color .4s}
.card-title{position:relative;z-index:1;font:700 18px var(--f-display);text-transform:uppercase;color:var(--ink)}
.card-desc{position:relative;z-index:1;font:400 14px/1.6 var(--f-body);color:var(--muted)}
.card-glow{position:absolute;top:-40px;right:-40px;width:170px;height:170px;opacity:0;transition:opacity .4s;pointer-events:none;
  mask-image:radial-gradient(circle at 72% 26%,#000 0%,#000 22%,transparent 65%);
  -webkit-mask-image:radial-gradient(circle at 72% 26%,#000 0%,#000 22%,transparent 65%)}

.pop{position:absolute;pointer-events:none;width:320px;background:rgba(10,10,20,.94);border:1px solid var(--violet);
  padding:14px 16px;opacity:0;transform:translateY(6px) scale(.97);
  transition:opacity .25s ease,transform .25s cubic-bezier(.16,1,.3,1);z-index:40}
.pop.show{opacity:1;transform:translateY(0) scale(1)}
.pop::before,.pop::after{content:"";position:absolute;width:6px;height:6px;border-color:var(--cyan);border-style:solid}
.pop::before{left:-3px;top:-3px;border-width:1.2px 0 0 1.2px}
.pop::after{right:-3px;bottom:-3px;border-width:0 1.2px 1.2px 0}
.pop .pt{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--cyan);text-transform:uppercase;margin-bottom:7px}
.pop p{font-size:13px;line-height:1.5;color:var(--ink);margin:0}

.gradient-accent{background:linear-gradient(90deg,var(--violet),var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(123,108,240,.45))}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* ─────────────────────────────────────────────────────────────
   BRAND / VEHICLE COLOUR MAP — the only other place brand hex
   values may appear besides DATA. Edit these 3 lines (+ logo
   markup below) to re-skin the whole file for another client:
   --violet, --cyan and #logoMark.
   ───────────────────────────────────────────────────────────── */
:root{
  --c-kingfisher:var(--cyan);
  --c-budweiser:#7B6CF0; --c-tuborg:#6155C4; --c-bira91:#8E86D9; --c-corona:#4E47AE;
  --c-carlsberg:#A5A2C7; --c-haywards5000:#6C7091; --c-simba:#4A4E6B; --c-untracked:#2C2F44;
  --v-soda:#5B8FA8; --v-nonalc:#6FA8A0; --v-music:#9B7BA8; --v-merch:#A88F6F; --v-direct:#C4B57A; --v-unclassified:#3A3D52;
  --pos:#6FA8A0; --neu:#565C78; --neg:#C48A9B;
}
*{box-sizing:border-box}
body{min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;background:none;border:0;color:inherit;cursor:pointer}
svg{display:block}
.mono{font-family:var(--f-mono)}
.dim{color:var(--dim)}
.muted{color:var(--muted)}
.hatch-note{font:400 10px var(--f-mono);letter-spacing:.04em;color:var(--dim)}

/* ── background field ── */
#bgField{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.05}
#bgField svg{width:100%;height:100%}
.bg-mask-top{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 0%,rgba(123,108,240,.10),transparent 70%),
  linear-gradient(180deg,transparent 0%,transparent 55%,var(--base) 100%)}

/* ── app shell ── */
.app{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{width:224px;flex:none;border-right:1px solid var(--hairline);padding:20px 0 24px;
  display:flex;flex-direction:column;gap:2px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}
.side-brandmark{display:flex;align-items:center;gap:10px;padding:6px 22px 20px}
.side-brandmark span{font:700 12px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink)}
.side-section{padding:20px 22px 8px;font:700 10px var(--f-mono);letter-spacing:.1em;color:var(--dim)}
.side-link{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:10px 22px;font:400 12px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);
  cursor:pointer;border-left:2px solid transparent;transition:color .2s,border-color .2s,background-color .2s}
.side-link:hover{color:var(--ink);background:rgba(123,108,240,.07)}
.side-link.active{color:var(--ink);border-left-color:var(--cyan);background:rgba(157,211,255,.07)}
.side-link.disabled{color:var(--dim);cursor:default}
.side-link.disabled:hover{color:var(--dim);background:none}
.side-tag{font:700 9px var(--f-mono);letter-spacing:.08em;padding:2px 6px;border:1px solid var(--hairline);border-radius:2px;color:var(--dim)}
.side-brand-row{display:flex;align-items:center;gap:9px;padding:8px 22px;font:400 12px var(--f-mono);color:var(--muted);cursor:pointer;transition:color .2s}
.side-brand-row:hover{color:var(--ink)}
.side-swatch{width:8px;height:8px;border-radius:1px;flex:none}
.side-you{margin-left:auto;font:700 8px var(--f-mono);color:var(--cyan);letter-spacing:.08em}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:35;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 30px;border-bottom:1px solid var(--hairline);background:rgba(7,7,13,.88);backdrop-filter:blur(10px)}
.tb-logo{width:24px;height:24px;flex:none}
.tb-title{font:700 13px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.tb-sep{width:1px;height:20px;background:var(--hairline);flex:none}
.tb-client{font:400 12px var(--f-mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.tb-spacer{flex:1}
.tb-range{position:relative}
.tb-range-btn{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--hairline);border-radius:2px;
  font:400 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink);cursor:pointer}
.tb-range-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--surface-2);border:1px solid var(--hairline);
  min-width:150px;z-index:50;opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .18s,transform .18s}
.tb-range-menu.open{opacity:1;pointer-events:auto;transform:translateY(0)}
.tb-range-menu button{display:block;width:100%;text-align:left;padding:10px 14px;font:400 11px var(--f-mono);
  letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tb-range-menu button:hover{color:var(--ink);background:rgba(123,108,240,.08)}
.tb-range-menu button.active{color:var(--cyan)}
.tb-vs{font:400 10px var(--f-mono);color:var(--dim);letter-spacing:.05em;white-space:nowrap}
.tb-fresh{font:400 10px var(--f-mono);color:var(--dim);letter-spacing:.03em;white-space:nowrap}
.tb-fresh.stale{color:var(--violet)}
.stale-chip{display:inline-block;margin-left:7px;font:700 9px var(--f-mono);letter-spacing:.08em;color:#0A0A12;background:var(--violet);padding:2px 7px;border-radius:2px;vertical-align:1px}

/* ── loading / error states (Phase 4e-iii) ── */
.skeleton{background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 37%,var(--surface) 63%);background-size:400% 100%;animation:skeleton-shine 1.4s ease infinite;border-radius:4px}
@keyframes skeleton-shine{0%{background-position:100% 50%}100%{background-position:0% 50%}}
.skeleton-line{height:14px;margin-bottom:10px}
.skeleton-block{height:220px}
.skeleton-card{border:1px solid var(--hairline);border-radius:6px;padding:32px;background:linear-gradient(180deg,var(--surface),#0C0C16);display:flex;flex-direction:column;gap:14px}
.data-error-panel{border:1px solid var(--violet);background:var(--surface);padding:44px 40px;max-width:560px;margin:100px auto;text-align:center}
.data-error-panel .h2{color:var(--violet);margin-bottom:14px}
.data-error-panel p{font:400 13.5px/1.7 var(--f-body);color:var(--muted);margin:0 0 6px}
.data-error-panel .derr-msg{font-family:var(--f-mono);font-size:11px;color:var(--dim);margin-top:16px;word-break:break-word}

main{flex:1;min-width:0;padding:36px 40px 90px}
.crumb{display:flex;align-items:center;gap:6px;font:400 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:18px}
.crumb b{color:var(--muted);cursor:pointer}
.crumb b:hover{color:var(--ink)}
.crumb b.current{color:var(--ink);cursor:default}

.rev{opacity:0;transform:translateY(14px);transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .5s cubic-bezier(.16,1,.3,1)}
.rev.in{opacity:1;transform:translateY(0)}

.section{margin-top:56px}
.section:first-of-type{margin-top:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:18px;margin-bottom:20px;flex-wrap:wrap}

/* headline */
.headline-block{padding:34px 0 26px;border-bottom:1px solid var(--hairline)}
.headline-fact{margin-top:10px;font:400 12px var(--f-mono);color:var(--muted);letter-spacing:.03em}
.headline-fact b{color:var(--cyan);font-weight:700}

/* controls row */
.controls-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:22px 0 26px}

/* position block: radial + bars */
.position-grid{display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:28px;align-items:start}
@media(max-width:1180px){.position-grid{grid-template-columns:1fr}}
.radial-wrap{position:relative;border:1px solid var(--hairline);border-radius:6px;background:linear-gradient(180deg,var(--surface),#0C0C16);padding:20px}
.radial-wrap svg{width:100%;height:auto;overflow:visible}
.ring{fill:none;transition:opacity .2s ease}
.ring-track{fill:none;stroke:var(--hairline)}
.ring-group{cursor:pointer;transition:opacity .2s ease}
.ring-group.faded{opacity:.35}
.ring-value.tier-derived,.tier-derived{text-decoration:underline;text-decoration-color:var(--cyan);text-underline-offset:3px}
.ring-label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.04em;fill:var(--muted)}
.ring-value{font-family:var(--f-display);font-weight:700;fill:var(--ink)}
.ring-you{fill:var(--cyan);font-family:var(--f-mono);font-weight:700;font-size:8px;letter-spacing:.1em}
.ceiling-label{font-family:var(--f-mono);font-size:9px;fill:var(--dim);letter-spacing:.04em}
.centre-label{font-family:var(--f-mono);font-size:9.5px;fill:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.centre-fact{font-family:var(--f-display);font-weight:700;fill:var(--ink);text-transform:uppercase}
.centre-value{font-family:var(--f-display);font-weight:700;fill:var(--ink)}
.centre-n{font-family:var(--f-mono);font-size:8.5px;fill:var(--dim);letter-spacing:.03em}

.ranked-bars{display:flex;flex-direction:column}
.vehicle-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.vchip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--hairline);border-radius:999px;
  font:400 10px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:all .2s}
.vchip .sw{width:7px;height:7px;border-radius:50%;flex:none}
.vchip:hover{color:var(--ink);border-color:var(--muted)}
.vchip.active{color:var(--ink);border-color:var(--cyan);background:rgba(157,211,255,.08)}

.bar-list{display:flex;flex-direction:column;gap:4px}
.bar-row{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:14px;padding:9px 4px;
  border-bottom:1px solid rgba(30,30,48,.6);cursor:pointer;transition:background-color .2s}
.bar-row:hover{background:rgba(123,108,240,.05)}
.bar-row.untracked{cursor:default;opacity:.65}
.bar-row.untracked:hover{background:none}
.bar-rank{font:700 11px var(--f-mono);color:var(--dim)}
.bar-mid{min-width:0}
.bar-name-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.bar-name{font:700 12px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.bar-you{font:700 8px var(--f-mono);letter-spacing:.08em;color:var(--cyan);border:1px solid var(--cyan);padding:1px 5px;border-radius:2px}
.bar-move{font:700 10px var(--f-mono)}
.bar-move.up{color:var(--cyan)}
.bar-move.down{color:var(--violet)}
.bar-move.flat{color:var(--dim)}
.bar-sent{font:400 10px var(--f-mono);letter-spacing:.02em;color:var(--dim);display:inline-flex;align-items:center;gap:3px}
.bar-sent.pos{color:var(--pos)}
.bar-sent.neg{color:var(--neg)}
.bar-track{position:relative;height:10px;background:rgba(255,255,255,.03);border-radius:2px;overflow:hidden}
.bar-fill{position:absolute;inset:0 auto 0 0;border-radius:2px;transition:width .7s cubic-bezier(.16,1,.3,1)}
.bar-fill.hatched{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.55) 0 2px,transparent 2px 6px);opacity:.82}
.bar-right{text-align:right;white-space:nowrap}
.bar-pct{font:700 15px var(--f-display);color:var(--ink)}
.bar-expander{width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--dim);transition:transform .25s}
.bar-expander.open{transform:rotate(90deg);color:var(--cyan)}
.bar-members{overflow:hidden;max-height:0;transition:max-height .4s cubic-bezier(.16,1,.3,1)}
.bar-members.open{max-height:600px}
.bar-member-row{display:grid;grid-template-columns:28px 1fr auto;gap:14px;padding:8px 4px 8px 20px;align-items:center;border-bottom:1px dashed rgba(30,30,48,.5)}
.bar-member-row .bar-name{font-size:11px;color:var(--muted)}
.member-pop{font:400 9px var(--f-mono);color:var(--dim)}
.denom-line{margin-top:14px;font:400 10px var(--f-mono);letter-spacing:.03em;color:var(--dim)}
.caveat-line{font:400 10px var(--f-mono);letter-spacing:.02em;color:var(--dim);margin-top:8px}

.legend-row{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--hairline)}
.legend-item{display:flex;align-items:center;gap:8px;font:400 10px var(--f-mono);letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.legend-swatch{width:22px;height:8px;border-radius:2px;flex:none}
.legend-swatch.derived{background:var(--ink);position:relative}
.legend-swatch.derived::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--cyan)}
.legend-swatch.modelled{background-color:var(--muted);background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.35) 0 2px,transparent 2px 6px);opacity:.82}
.legend-swatch.measured{background:var(--ink)}

/* surrogate band */
.surrogate-band{display:flex;flex-direction:column;gap:10px}
.sband-legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:6px}
.sband-legend .li{display:flex;align-items:center;gap:6px;font:400 10px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.sband-legend .sw{width:10px;height:10px;border-radius:2px}
.sband-row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:14px}
.sband-label{font:700 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sband-track{display:flex;height:24px;border-radius:3px;overflow:hidden;background:var(--surface-2)}
.sband-seg{height:100%;transition:width .6s cubic-bezier(.16,1,.3,1);cursor:pointer}

/* movement strip */
.movement-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.movement-grid{grid-template-columns:1fr}}
.move-card{padding:22px 24px}
.move-eyebrow{font:700 10px var(--f-mono);letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.move-brand{font:700 16px var(--f-display);text-transform:uppercase;margin-top:8px}
.move-delta{font:700 20px var(--f-display);margin-top:2px}
.move-delta.up{color:var(--cyan)}
.move-delta.down{color:var(--violet)}
.move-sub{font:400 11px var(--f-mono);color:var(--muted);margin-top:6px}

/* platform cards */
.platform-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:1000px){.platform-grid{grid-template-columns:1fr}}
.pf-card{cursor:pointer}
.pf-card:hover{transform:translateY(-3px);border-color:rgba(123,108,240,.55)}
.pf-card:hover .card-glow{opacity:1}
.pf-card.pending{cursor:default;opacity:.55}
.pf-card.pending:hover{transform:none;border-color:var(--hairline)}
.pf-head{display:flex;align-items:center;justify-content:space-between}
.pf-pending-tag{font:700 9px var(--f-mono);letter-spacing:.1em;color:var(--dim);border:1px solid var(--hairline);padding:3px 8px;border-radius:2px}
.pf-leader{font:400 12px var(--f-mono);color:var(--muted)}
.pf-you-row{display:flex;align-items:center;gap:10px;margin-top:2px}
.pf-rank-num{font:700 26px var(--f-display);color:var(--cyan)}
.pf-spark{margin-top:6px}
.pf-move{margin-left:auto}

/* insight block */
.insight-block{border:1px solid var(--hairline);background:var(--surface);padding:22px 26px;position:relative}
.insight-block::before,.insight-block::after{content:"";position:absolute;width:10px;height:10px;border-color:var(--cyan);border-style:solid}
.insight-block::before{left:-1px;top:-1px;border-width:1.6px 0 0 1.6px}
.insight-block::after{right:-1px;bottom:-1px;border-width:0 1.6px 1.6px 0}
.insight-block p{font:400 13.5px/1.7 var(--f-body);color:var(--ink);margin:0 0 8px}
.insight-block p:last-child{margin-bottom:0}
.insight-block b{color:var(--cyan)}

/* chart generic */
.chart-card{padding:26px 28px}
.hbar-row{display:grid;grid-template-columns:130px 1fr 90px;align-items:center;gap:12px;padding:7px 0}
.hbar-label{font:700 11px var(--f-mono);letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar-track{position:relative;height:18px;background:rgba(255,255,255,.03);border-radius:2px;display:flex;overflow:hidden}
.hbar-seg{height:100%;transition:width .6s cubic-bezier(.16,1,.3,1)}
.hbar-seg.hatched{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 2px,transparent 2px 6px);opacity:.82}
.hbar-val{font:400 11px var(--f-mono);color:var(--dim);white-space:nowrap}
.hbar-val u{color:var(--cyan);text-decoration:none;border-bottom:1px solid var(--cyan)}

.breakdown-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:8px}
@media(max-width:900px){.breakdown-grid{grid-template-columns:repeat(2,1fr)}}
.bd-card{border:1px solid var(--hairline);padding:14px 16px}
.bd-name{font:700 11px var(--f-mono);letter-spacing:.03em;color:var(--ink);text-transform:uppercase;margin-bottom:8px}
.bd-metric{display:flex;justify-content:space-between;font:400 10.5px var(--f-mono);color:var(--muted);padding:3px 0}
.bd-metric b{color:var(--ink);font-weight:700}

.scatter-wrap{position:relative}
.scatter-wrap svg{width:100%;height:auto}
.sc-axis{stroke:var(--hairline);stroke-width:1}
.sc-quad-line{stroke:var(--hairline);stroke-dasharray:3 4}
.sc-quad-label{font-family:var(--f-mono);font-size:9px;fill:var(--dim);letter-spacing:.06em}
.sc-dot-label{font-family:var(--f-mono);font-size:9.5px;fill:var(--muted)}
.sc-dot{transition:opacity .2s}

.trend-wrap svg{width:100%;height:auto}
.trend-line{fill:none}
.search-strip{margin-top:4px}
.search-strip svg{width:100%;height:auto}

.matrix-table{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:11px}
.matrix-table th{text-align:left;font-weight:700;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;font-size:9.5px;padding:6px 8px;border-bottom:1px solid var(--hairline)}
.matrix-table td{padding:8px;border-bottom:1px solid rgba(30,30,48,.5);color:var(--muted)}
.matrix-table td.theme-name{color:var(--ink);font-weight:700;text-transform:uppercase}
.mx-bar{display:flex;height:12px;width:100%;border-radius:2px;overflow:hidden;min-width:90px}
.mx-seg{height:100%}
.n-line{font:400 10px var(--f-mono);color:var(--dim);margin-top:10px}

.outlier-row{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid rgba(30,30,48,.5);font:400 11.5px var(--f-mono)}
.outlier-row .ot{color:var(--muted)}
.outlier-row .og{color:var(--neg);font-weight:700}

.headtohead{display:flex;flex-direction:column;gap:16px}
.h2h-row{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.h2h-metric{font:700 10px var(--f-mono);color:var(--dim);letter-spacing:.05em;text-transform:uppercase;text-align:right}
.h2h-bars{display:flex;flex-direction:column;gap:5px}
.h2h-bar-row{display:flex;align-items:center;gap:8px}
.h2h-bar-track{flex:1;height:9px;background:rgba(255,255,255,.03);border-radius:2px;overflow:hidden}
.h2h-bar-fill{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.16,1,.3,1)}
.h2h-bar-name{font:400 9.5px var(--f-mono);color:var(--dim);width:78px;flex:none}
.h2h-bar-val{font:700 10px var(--f-mono);color:var(--ink);width:56px;text-align:right}

.member-contrib{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.mc-card{border:1px solid var(--hairline);padding:14px}
.mc-name{font:700 11px var(--f-mono);text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mc-val{font:700 20px var(--f-display);color:var(--ink)}
.mc-sub{font:400 10px var(--f-mono);color:var(--dim);margin-top:2px}

.split-100{display:flex;height:26px;border-radius:3px;overflow:hidden}
.split-seg{height:100%;transition:width .6s cubic-bezier(.16,1,.3,1)}
.split-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
.split-legend .li{display:flex;align-items:center;gap:6px;font:400 10px var(--f-mono);color:var(--muted)}
.rank-chip{font:700 9px var(--f-mono);border:1px solid var(--hairline);border-radius:2px;padding:2px 6px;color:var(--muted)}

.detail-header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.detail-rank{font:700 12px var(--f-mono);color:var(--dim)}

/* methodology modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(4,4,8,.72);z-index:80;display:flex;align-items:flex-start;justify-content:center;
  padding:60px 24px;opacity:0;pointer-events:none;transition:opacity .25s ease}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{max-width:760px;width:100%;max-height:80vh;overflow-y:auto;background:var(--surface-2);border:1px solid var(--violet);padding:36px 40px 44px;
  transform:translateY(10px);transition:transform .25s cubic-bezier(.16,1,.3,1)}
.modal-backdrop.open .modal{transform:translateY(0)}
.modal h3{font:700 13px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);margin:26px 0 10px}
.modal h3:first-child{margin-top:0}
.modal p,.modal li{font:400 13px/1.7 var(--f-body);color:var(--muted)}
.modal code{font-family:var(--f-mono);color:var(--ink);background:rgba(255,255,255,.04);padding:1px 5px;border-radius:2px}
.modal-close{position:absolute;top:16px;right:20px;font-family:var(--f-mono);font-size:20px;color:var(--dim);cursor:pointer}
.modal-close:hover{color:var(--ink)}
.mtable{width:100%;border-collapse:collapse;margin:8px 0 4px;font-family:var(--f-mono);font-size:11.5px}
.mtable td,.mtable th{padding:5px 8px;border-bottom:1px solid var(--hairline);color:var(--muted);text-align:left}
.mtable th{color:var(--dim);text-transform:uppercase;letter-spacing:.05em;font-size:9.5px}
.handle-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}

/* pending pop */
.pending-note{font:400 11px/1.5 var(--f-mono);color:var(--muted)}

@page{margin:14mm}
@media print{
  /* Redefining the tokens themselves (rather than chasing every selector that
     reads them) flips every card, SVG stroke and text fill that references
     var(--ink)/var(--hairline)/etc. — including the radial's ring tracks,
     which are a near-invisible 12px hairline in dark mode but read as a
     solid black disc at that width once the ground goes white if left alone. */
  :root{
    --base:#fff; --surface:#fff; --surface-2:#fff; --hairline:#D8DAE6;
    --ink:#0A0A12; --muted:#4B4B58; --dim:#7C7C8C;
    --violet:#5B4FD0; --cyan:#1E6FA8; --violet-soft:#DCD9F7; --hot:#0A0A12;
  }
  #bgField,.bg-mask-top,.sidebar,.topbar,.pop,.modal-backdrop{display:none !important}
  body{background:#fff !important}
  .app{display:block}
  main{padding:24px 0 0}
  .card,.radial-wrap,.insight-block,.chart-card,.move-card,.pf-card,.mc-card,.bd-card{background:#fff !important;box-shadow:none !important}
  .section{page-break-inside:avoid;margin-top:26px}
  .print-footer{display:block !important;margin-top:30px;font:400 9px var(--f-mono);color:#555;border-top:1px solid #D0D3E0;padding-top:10px}
  .bar-fill.hatched,.hbar-seg.hatched{opacity:.95}
  .card-glow{display:none !important}
}
.print-footer{display:none}
</style>
</head>
<body>

<div id="bgField"></div>
<div class="bg-mask-top"></div>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-col">
    <header class="topbar" id="topbar"></header>
    <main id="view"></main>
    <div class="print-footer" id="printFooter"></div>
  </div>
</div>

<div class="pop" id="pop"></div>

<div class="modal-backdrop" id="methodModal">
  <div class="modal">
    <span class="modal-close" data-close-modal>×</span>
    <div id="methodBody"></div>
  </div>
</div>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════
   DATA LAYER
   CFG / VEHICLES / THEMES are configuration, not data (Phase 4e-i) — they
   stay as constants. Everything else is fetched from ./data.json by init()
   below and assigned into these `let` bindings; nothing renders until that
   fetch resolves (see showLoading/showDataError further down).
   ═══════════════════════════════════════════════════════════════════════ */

const CFG = {
  cpm: { instagram: 182, youtube: 227 },
  formatMult: { video: 1.24, mixed: 1.00, static: 0.86 },
  ceilingSteps: [20,25,30,40,50,60,70,80,100]
};
const STALENESS_HOURS = 30; // Phase 4e-iv — daily pipeline, so one missed run should show

const VEHICLES = [
  { id:'soda',        label:'SODA / WATER',      color:'var(--v-soda)' },
  { id:'nonalc',       label:'NON-ALC',            color:'var(--v-nonalc)' },
  { id:'music',        label:'MUSIC / EVENTS',     color:'var(--v-music)' },
  { id:'merch',        label:'MERCH / LIFESTYLE',  color:'var(--v-merch)' },
  { id:'direct',        label:'DIRECT',             color:'var(--v-direct)' },
  { id:'unclassified',  label:'UNCLASSIFIED',       color:'var(--v-unclassified)' }
];

const THEMES = [
  { id:'availability', label:'AVAILABILITY',    lift:1.9 },
  { id:'price',         label:'PRICE',            lift:1.5 },
  { id:'taste',          label:'TASTE',            lift:1.0 },
  { id:'events',          label:'EVENTS / ACCESS',  lift:0.6 },
  { id:'nostalgia',        label:'BRAND / NOSTALGIA',lift:0.3 },
  { id:'other',              label:'OTHER',            lift:1.0 }
];

const RANGES = {
  '7':  { label:'LAST 7 DAYS' },
  '30': { label:'LAST 30 DAYS' },
  '90': { label:'LAST 90 DAYS' }
};

/* Phase 4e-i — populated by init()'s fetch, empty until then. */
let BRANDS = {}, PROFILES = {}, PORTFOLIOS = {}, UNTRACKED = {}, META = {};

/* The emitted schema carries `themeShare` (share of classified comments per
   theme) and one aggregate `sentiment{pos,neu,neg}` — not a full per-theme
   polarity cross-tab, because classify.py samples up to 200 comments per
   brand rather than exhaustively tagging every theme×polarity cell. This
   reconstructs the {count,pos,neu,neg}-per-theme shape the render functions
   already expect, skewing each theme's polarity away from the brand
   aggregate by THEMES[].lift (negative comments cluster on availability/
   price far more than on taste or nostalgia) — the same derivation the
   placeholder build used, now fed by real themeShare/sentiment instead of
   hand-authored ones, computed at read time instead of once at parse time
   since comments are no longer bucketed per 7/30/90 window (Phase 4b/4e).*/
function deriveThemeMatrix(profile){
  const sample = (profile && profile.commentSample) || {n:0, spamRate:META.spamRateBase||0};
  const sentiment = (profile && profile.sentiment) || {pos:0,neu:0,neg:0};
  const matrix = {};
  THEMES.forEach(t=>{
    const share = (profile && profile.themeShare && profile.themeShare[t.id]) || 0;
    const count = Math.round(sample.n*share);
    let neg = Math.min(0.85, Math.max(0.02, sentiment.neg*t.lift));
    let pos = Math.max(0.05, sentiment.pos*(1.4-t.lift*0.3));
    pos = Math.min(pos, 1-neg-0.05);
    const neu = Math.max(0, 1-pos-neg);
    matrix[t.id] = { count, pos, neu, neg };
  });
  return { raw: sample.n, spamRate: sample.spamRate, matrix };
}

/* ── end data layer ── */

/* ═══════════════════════════ STATE & UTIL ═══════════════════════════ */
const STATE = { lens:'brand', metric:'sov', range:'30', vehicleFilter:null,
  page:'overview', platform:'instagram', brandId:null, groupId:null, fromPlatform:null };

const $  = (s,c)=> (c||document).querySelector(s);
const $$ = (s,c)=> Array.from((c||document).querySelectorAll(s));
const fmtInt = n => Math.round(n).toLocaleString('en-IN');
const fmtPct = (n,d) => (d===undefined?1:d)===0 ? Math.round(n)+'%' : n.toFixed(d===undefined?1:d)+'%';
const fmtPP  = n => (n>0?'+':'') + n.toFixed(1)+'pp';
const clamp  = (n,a,b)=>Math.max(a,Math.min(b,n));
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TIP_SEQ = 0;
const TIP_REGISTRY = {};
function registerTip(title, lines){
  const id = 'tip'+(TIP_SEQ++);
  TIP_REGISTRY[id] = {title, lines};
  return id;
}

function ease(t){ // cubic-bezier(.16,1,.3,1) approximation
  return 1 - Math.pow(1-t, 3);
}
function tween(duration, onFrame, onDone){
  const t0 = performance.now();
  const reduced = (typeof window!=='undefined' && window.matchMedia) ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
  if(reduced){ onFrame(1); if(onDone) onDone(); return; }
  function step(now){
    const t = clamp((now-t0)/duration,0,1);
    onFrame(ease(t));
    if(t<1) requestAnimationFrame(step); else if(onDone) onDone();
  }
  requestAnimationFrame(step);
}

/* ═══════════════════════════ COMPUTATION ═══════════════════════════ */
function metricValue(bd, formatMix, metric, vehicleFilter, vehicleMixObj){
  let base;
  if(metric==='sov'){
    base = bd.ig.organic+bd.ig.paid+bd.yt.organic+bd.yt.paid;
  } else {
    base = (bd.ig.paid/1000)*CFG.cpm.instagram*CFG.formatMult[formatMix]
         + (bd.yt.paid/1000)*CFG.cpm.youtube*CFG.formatMult[formatMix];
  }
  if(vehicleFilter && vehicleMixObj) base *= (vehicleMixObj[vehicleFilter]||0);
  return base;
}

function computeRows(range,lens,metric,vehicleFilter){
  const rows = [];
  if(lens==='brand'){
    Object.keys(BRANDS).forEach(id=>{
      const b=BRANDS[id], p=PROFILES[id], bd=p.windows[range];
      const val = metricValue(bd,p.formatMix,metric,vehicleFilter,p.vehicleMix);
      const prevVal = metricValue(p.prev30,p.formatMix,metric,vehicleFilter,p.vehicleMix);
      rows.push({id,type:'brand',name:b.name,color:b.color,isClient:b.isClient,handleIG:b.handleIG,handleYT:b.handleYT,
        value:val, prevValue:prevVal, tier: metric==='sov'?'derived':'modelled',
        vehicleMix:p.vehicleMix, formatMix:p.formatMix, bd, negDeltaPP:p.negDeltaPP, parent:b.parent});
    });
  } else {
    Object.keys(PORTFOLIOS).forEach(pid=>{
      const po=PORTFOLIOS[pid];
      let val=0, prevVal=0; const members=[];
      po.members.forEach(mid=>{
        const b=BRANDS[mid], p=PROFILES[mid], bd=p.windows[range];
        const mv = metricValue(bd,p.formatMix,metric,vehicleFilter,p.vehicleMix);
        const pv = metricValue(p.prev30,p.formatMix,metric,vehicleFilter,p.vehicleMix);
        val+=mv; prevVal+=pv;
        members.push({id:mid,name:b.name,color:b.color,value:mv,formatMix:p.formatMix});
      });
      rows.push({id:pid,type:'portfolio',name:po.name,color:po.color,isClient:!!po.isClient,
        value:val, prevValue:prevVal, tier: metric==='sov'?'derived':'modelled', members, multi:members.length>1});
    });
  }
  let untrackedVal=0, untrackedPrev=0;
  if(metric==='sov' && !vehicleFilter){
    // real ingestion only ever covers the eight named competitors — the
    // untracked tail has no measured window (see build_data.py), so it
    // contributes 0 rather than a fabricated share (Phase 4b).
    const uw = (UNTRACKED.windows && UNTRACKED.windows[range]) || {};
    const uIg = uw.ig || {organic:0,paid:0}, uYt = uw.yt || {organic:0,paid:0};
    untrackedVal = (uIg.organic||0)+(uIg.paid||0)+(uYt.organic||0)+(uYt.paid||0);
    const up = UNTRACKED.prev30 || {};
    const upIg = up.ig || {organic:0,paid:0}, upYt = up.yt || {organic:0,paid:0};
    untrackedPrev = (upIg.organic||0)+(upIg.paid||0)+(upYt.organic||0)+(upYt.paid||0);
  }
  const total = rows.reduce((s,r)=>s+r.value,0) + untrackedVal;
  const prevTotal = rows.reduce((s,r)=>s+r.prevValue,0) + untrackedPrev;
  rows.forEach(r=>{ r.pct = total? r.value/total*100:0; r.prevPct = prevTotal? r.prevValue/prevTotal*100:0; });
  rows.sort((a,b)=>b.value-a.value);
  rows.forEach((r,i)=>r.rank=i+1);
  const prevSorted=[...rows].sort((a,b)=>b.prevValue-a.prevValue);
  prevSorted.forEach((r,i)=>r.prevRank=i+1);
  rows.forEach(r=>{ r.deltaPP = r.pct-r.prevPct; r.rankMove = r.prevRank - r.rank; });
  rows.forEach(r=>{ if(r.members){ r.members.forEach(m=>{ m.pct = total? m.value/total*100:0; m.pctOfParent = r.value? m.value/r.value*100:0; }); r.members.sort((a,b)=>b.value-a.value); } });
  let untrackedRow=null;
  if(metric==='sov' && !vehicleFilter){
    untrackedRow = {id:'untracked',type:'untracked',name:UNTRACKED.name,color:UNTRACKED.color,value:untrackedVal,pct: total?untrackedVal/total*100:0,tier:'modelled'};
  }
  return { rows, total, untracked:untrackedRow, universeCount:Math.round(total) };
}

function ceilingFor(maxPct){
  const target = maxPct*1.15;
  for(const c of CFG.ceilingSteps) if(c>target) return c;
  return 100;
}

/* ═══════════════════════════ SVG / RADIAL HELPERS ═══════════════════════════ */
function polarPoint(cx,cy,r,angleDeg){
  const rad = angleDeg*Math.PI/180;
  return { x: cx+r*Math.cos(rad), y: cy+r*Math.sin(rad) };
}
function arcPath(cx,cy,r,startDeg,endDeg){
  if(endDeg<=startDeg+0.001) endDeg = startDeg+0.001;
  const s = polarPoint(cx,cy,r,startDeg), e = polarPoint(cx,cy,r,endDeg);
  const large = (endDeg-startDeg) > 180 ? 1 : 0;
  return `M ${s.x.toFixed(2)} ${s.y.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${e.x.toFixed(2)} ${e.y.toFixed(2)}`;
}
function sideAnchor(angleDeg){
  let a = ((angleDeg%360)+360)%360; // 0..360, 0 = 3 o'clock
  return (a>90 && a<270) ? 'end' : 'start';
}
function pointsToSmoothPath(pointsStr){
  const pts = pointsStr.trim().split(/\s+/).map(pair=>{ const [x,y]=pair.split(',').map(Number); return {x,y}; });
  if(pts.length<2) return '';
  if(pts.length===2) return `M${pts[0].x},${pts[0].y} L${pts[1].x},${pts[1].y}`;
  let d = `M${pts[0].x},${pts[0].y} `;
  for(let i=0;i<pts.length-1;i++){
    const p0 = pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6, c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6, c2y=p2.y-(p3.y-p1.y)/6;
    d += `C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)} `;
  }
  return d;
}
function dominantVehicle(mix){
  let best='direct',bv=-1;
  Object.keys(mix).forEach(k=>{ if(mix[k]>bv){bv=mix[k];best=k;} });
  return VEHICLES.find(v=>v.id===best);
}
function navForId(id){ return (id in PORTFOLIOS) ? `group:${id}` : `brand:${id}`; }
function brandLink(id, name){ return `<b data-nav="${navForId(id)}" style="cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px">${esc((name||BRANDS[id]&&BRANDS[id].name||(PORTFOLIOS[id]&&PORTFOLIOS[id].name)||id).toUpperCase())}</b>`; }
function brandLinkProse(id, name){ return `<b data-nav="${navForId(id)}" style="cursor:pointer;color:var(--cyan);font-weight:700;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px">${esc(name)}</b>`; }

/* ═══════════════════════════ RADIAL CHART ═══════════════════════════ */
function renderRadial(computed, opts){
  const rows = computed.rows;
  const n = rows.length;
  const maxPct = Math.max(0.1, ...rows.map(r=>r.pct));
  const ceiling = ceilingFor(maxPct);
  const cx=210, cy=210, R_OUTER=170;
  const R_INNER = n>=8 ? 56 : 78;
  const strokeW = n>=8 ? 12 : 15;
  const step = n>1 ? (R_OUTER-R_INNER)/(n-1) : 0;
  const leader = rows[0];
  let rings='';
  rows.forEach((row,i)=>{
    const r = R_OUTER - i*step;
    const sweep = row.pct>0 ? clamp(row.pct/ceiling*280, 3, 280) : 0;
    const trackD = arcPath(cx,cy,r,-90,190);
    const endAngle = -90+sweep;
    const valD = sweep>0 ? arcPath(cx,cy,r,-90,endAngle) : '';
    // Value labels fan clockwise from the shared start point with a minimum
    // angular step so small, similarly-ranked slices (which all sweep barely
    // past the start) don't collide. Name labels run as a fixed-pitch vertical
    // list instead of following the rings themselves — 8 brand names at ring
    // radius/angle collide regardless of fan angle once names get long
    // ("HAYWARDS 5000"), so a column with a colour swatch keyed to each ring
    // is the legible option; the ring itself + hover/click still IDs the brand.
    const valueAngle = Math.max(endAngle, -90 + i*14);
    const nameListX = 20, nameListY0 = 46, nameLineH = n>=8 ? 15.5 : 22;
    const namePt = { x:nameListX, y:nameListY0 + i*nameLineH };
    const valPt = polarPoint(cx,cy,r,valueAngle);
    const anchor = sideAnchor(valueAngle);
    const tipId = registerTip(row.name.toUpperCase()+' · RANK '+row.rank, [
      fmtPct(row.pct,1)+' SHARE · '+fmtInt(row.value)+(opts.metric==='sov'?' impressions':' est. spend units'),
      'Δ vs previous period '+fmtPP(row.deltaPP),
      'Confidence: '+row.tier.toUpperCase(),
      row.vehicleMix ? 'Dominant vehicle: '+dominantVehicle(row.vehicleMix).label : ''
    ].filter(Boolean));
    const navTarget = row.type==='portfolio' ? `group:${row.id}` : `brand:${row.id}`;
    rings += `<g class="ring-group" data-tip-id="${tipId}" data-ring-idx="${i}" data-key="${row.id}" data-nav="${navTarget}">
      <path class="ring-track" d="${trackD}" stroke-width="${strokeW}"/>
      <path class="ring ring-val ring-tier-${row.tier}" data-r="${r}" data-end0="-90" data-end1="${endAngle}" d="${valD||'M0 0'}" stroke="${row.color}" stroke-width="${strokeW}" stroke-linecap="round" fill="none"/>
      ${row.tier==='modelled'&&sweep>0?`<path class="ring-hatch" data-r="${r}" data-end0="-90" data-end1="${endAngle}" d="${valD}" stroke="url(#hatchPattern)" stroke-width="${strokeW}" stroke-linecap="round" fill="none"/>`:''}
      <circle class="ring-legend-dot" cx="${namePt.x}" cy="${namePt.y-3}" r="3.4" fill="${row.color}"/>
      <text class="ring-label" x="${namePt.x+9}" y="${namePt.y}" text-anchor="start" font-size="9">${esc(row.name.toUpperCase())}</text>
      ${row.isClient?`<text class="ring-you" x="${namePt.x+9+row.name.length*6.1+11}" y="${namePt.y}" text-anchor="start">YOU</text>`:''}
      <text class="ring-value tier-${row.tier}" data-vr="${r}" x="${valPt.x + (anchor==='end'?-10:10)}" y="${valPt.y+4}" text-anchor="${anchor}" font-size="${n>=8?11:13}">${fmtPct(row.pct,1)}</text>
    </g>`;
  });
  // 230deg sits at the midpoint of the untouched 190-270deg track gap, so the
  // ceiling label never lands on top of a ring or value label regardless of data.
  const gapLabelPt = polarPoint(cx,cy,R_OUTER+16,255);

function captureRadialAngles(container){
  const map = {};
  $$('.ring-group', container).forEach(g=>{
    const p = $('.ring-val', g);
    if(p) map[g.dataset.key] = parseFloat(p.dataset.end1);
  });
  return map;
}
function animateRadial(container, prevAngles){
  const svg = $('#radialSvg', container);
  if(!svg) return;
  $$('.ring-group', svg).forEach((g,idx)=>{
    const key = g.dataset.key;
    const fromAngle = (prevAngles && prevAngles[key]!==undefined) ? prevAngles[key] : -90;
    const paths = $$('.ring-val, .ring-hatch', g);
    paths.forEach(path=>{
      const r = parseFloat(path.dataset.r), toAngle = parseFloat(path.dataset.end1);
      const cx=210,cy=210;
      const delay = fromAngle===-90 ? idx*70 : 0;
      path.style.opacity='0';
      setTimeout(()=>{
        path.style.opacity='1';
        tween(700, t=>{
          const cur = fromAngle + (toAngle-fromAngle)*t;
          path.setAttribute('d', cur>-90 ? arcPath(cx,cy,r,-90,cur) : '');
        });
      }, delay);
    });
  });
}
function bindRadialHover(container){
  const rg = $('#ringsGroup', container);
  if(!rg) return;
  rg.addEventListener('mouseover', e=>{
    const g = e.target.closest('.ring-group');
    if(!g) return;
    $$('.ring-group', rg).forEach(o=>o.classList.toggle('faded', o!==g));
    $('.ring-val', g) && $('.ring-val', g).setAttribute('filter','url(#ringGlow)');
  });
  rg.addEventListener('mouseout', e=>{
    const g = e.target.closest('.ring-group');
    if(!g) return;
    $$('.ring-group', rg).forEach(o=>o.classList.remove('faded'));
    $('.ring-val', g) && $('.ring-val', g).removeAttribute('filter');
  });
}

function barRowHtml(row, ceiling, opts){
  const widthPct = clamp(row.pct/ceiling*100, row.pct>0?1.5:0, 100);
  const moveCls = row.rankMove>0?'up':row.rankMove<0?'down':'flat';
  const moveTxt = row.rankMove>0?('▲'+row.rankMove):row.rankMove<0?('▼'+Math.abs(row.rankMove)):'—';
  const sentCls = row.negDeltaPP<0?'pos':row.negDeltaPP>0?'neg':'';
  const sentArrow = row.negDeltaPP<0?'▼':row.negDeltaPP>0?'▲':'—';
  const hatched = row.tier==='modelled' ? 'hatched' : '';
  const nav = row.type==='untracked' ? '' : `data-nav="${row.type==='portfolio'?'group:'+row.id:'brand:'+row.id}"`;
  const expander = row.multi ? `<span class="bar-expander" data-expander="${row.id}">▸</span>` : '<span style="width:16px;display:inline-block"></span>';
  let members = '';
  if(row.members){
    members = `<div class="bar-members" id="members-${row.id}">` + row.members.map(m=>`
      <div class="bar-member-row" data-nav="brand:${m.id}">
        <span></span>
        <div class="bar-mid">
          <div class="bar-name-row"><span class="bar-name">${esc(m.name.toUpperCase())}</span>
            <span class="member-pop">${fmtPct(m.pctOfParent,0)} of ${esc(row.name.toUpperCase())}</span>
          </div>
        </div>
        <div class="bar-right"><span class="bar-pct" style="font-size:12px">${fmtPct(m.pct,1)}</span></div>
      </div>`).join('') + `</div>`;
  }
  return `<div class="bar-row ${row.type==='untracked'?'untracked':''}" data-key="${row.id}" ${nav}>
      <span class="bar-rank">${row.type==='untracked'?'—':String(row.rank).padStart(2,'0')}</span>
      <div class="bar-mid">
        <div class="bar-name-row">
          ${row.multi?expander:''}
          <span class="bar-name">${esc(row.name.toUpperCase())}</span>
          ${row.isClient?'<span class="bar-you">YOU</span>':''}
          ${row.type!=='untracked'?`<span class="bar-move ${moveCls}">${moveTxt}</span>`:''}
          ${row.type!=='untracked'&&row.negDeltaPP!==undefined?`<span class="bar-sent ${sentCls}">SENTIMENT Δ ${sentArrow}${Math.abs(row.negDeltaPP).toFixed(1)}pp neg</span>`:''}
        </div>
        <div class="bar-track"><div class="bar-fill ${hatched}" style="width:${widthPct}%;background:${row.color}"></div></div>
      </div>

    </div>${members}`;
}
function renderBarsList(computed, ceiling, opts){
  let html = computed.rows.map(r=>barRowHtml(r,ceiling,opts)).join('');
  if(computed.untracked) html += barRowHtml(computed.untracked, ceiling, opts);
  return html;
}
function flipInto(container, renderFn){
  const before = new Map();
  $$('.bar-row', container).forEach(el=>before.set(el.dataset.key, el.getBoundingClientRect()));
  renderFn();
  $$('.bar-row', container).forEach(el=>{
    const f = before.get(el.dataset.key);
    if(!f){ el.style.opacity='0'; requestAnimationFrame(()=>{el.style.transition='opacity .5s ease'; el.style.opacity='1';}); return; }
    const l = el.getBoundingClientRect();
    const dy = f.top - l.top;
    if(Math.abs(dy)>0.5){
      el.style.transition='none'; el.style.transform=`translateY(${dy}px)`;
      requestAnimationFrame(()=>{ el.style.transition='transform .6s cubic-bezier(.16,1,.3,1)'; el.style.transform=''; });
    }
  });
  $$('.bar-fill', container).forEach(f=>{ const w=f.style.width; f.style.width='0%'; requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.width=w;})); });
}

/* ═══════════════════════════ HEADLINE ═══════════════════════════ */
function generateHeadline(range){
  const bC = computeRows(range,'brand','sov',null);
  const pC = computeRows(range,'portfolio','sov',null);
  const leaderBrand = bC.rows[0];
  const clientBrand = bC.rows.find(r=>r.isClient);
  const clientPf = pC.rows.find(r=>r.isClient);
  const rivalBrand = bC.rows.filter(r=>!r.isClient).sort((a,b)=>b.pct-a.pct)[0];
  const rivalPf = pC.rows.filter(r=>!r.isClient).sort((a,b)=>b.pct-a.pct)[0];
  const gapBrand = clientBrand.pct - rivalBrand.pct;
  const gapPf = clientPf.pct - rivalPf.pct;
  let headline;
  if(clientBrand.rank===1 && clientPf.rank===1){
    if(gapPf < gapBrand - 1){
      headline = `${clientBrand.name.toUpperCase()} LEADS ON VOICE — BUT ${rivalPf.name.toUpperCase()}'S PORTFOLIO CLOSES THE GAP.`;
    } else {
      headline = `${clientBrand.name.toUpperCase()} LEADS ON VOICE, ${gapBrand.toFixed(1)}PP AHEAD OF ${rivalBrand.name.toUpperCase()}.`;
    }
  } else if(clientBrand.rank===1 && clientPf.rank!==1){
    headline = `${clientBrand.name.toUpperCase()} LEADS AS A BRAND — BUT ${rivalPf.name.toUpperCase()}'S PORTFOLIO OUTSCALES IT.`;
  } else {
    headline = `${leaderBrand.name.toUpperCase()} LEADS VOICE — ${clientBrand.name.toUpperCase()} SITS AT #${clientBrand.rank}.`;
  }
  const lensRow = STATE.lens==='brand' ? clientBrand : clientPf;
  const fact = `${STATE.lens.toUpperCase()} LENS · ${esc(lensRow.name.toUpperCase())} AT ${fmtPct(lensRow.pct,1)} SOV · Δ ${fmtPP(lensRow.deltaPP)} VS PREVIOUS PERIOD`;
  return { headline, fact };
}

/* ═══════════════════════════ PLATFORM CARDS (overview) ═══════════════════════════ */
function platformMetricValue(bd, platformKey, formatMix, metric){
  const p = bd[platformKey];
  if(metric==='sov') return p.organic+p.paid;
  const cpm = platformKey==='ig' ? CFG.cpm.instagram : CFG.cpm.youtube;
  return (p.paid/1000)*cpm*CFG.formatMult[formatMix];
}
function computePlatformRows(range, platformKey, lens, metric){
  const rows=[];
  if(lens==='brand'){
    Object.keys(BRANDS).forEach(id=>{
      const b=BRANDS[id],p=PROFILES[id],bd=p.windows[range];
      const val = platformMetricValue(bd,platformKey,p.formatMix,metric);
      const prevVal = platformMetricValue(p.prev30,platformKey,p.formatMix,metric);
      rows.push({id,name:b.name,color:b.color,isClient:b.isClient,value:val,prevValue:prevVal});
    });
  } else {
    Object.keys(PORTFOLIOS).forEach(pid=>{
      const po=PORTFOLIOS[pid]; let val=0,prevVal=0;
      po.members.forEach(mid=>{
        const p=PROFILES[mid],bd=p.windows[range];
        const v=platformMetricValue(bd,platformKey,p.formatMix,metric);
        const pv=platformMetricValue(p.prev30,platformKey,p.formatMix,metric);
        val+=v; prevVal+=pv;
      });
      rows.push({id:pid,name:po.name,color:po.color,isClient:!!po.isClient,value:val,prevValue:prevVal});
    });
  }
  const total = rows.reduce((s,r)=>s+r.value,0);
  rows.forEach(r=>r.pct = total? r.value/total*100:0);
  rows.sort((a,b)=>b.value-a.value); rows.forEach((r,i)=>r.rank=i+1);
  const prevSorted=[...rows].sort((a,b)=>b.prevValue-a.prevValue); prevSorted.forEach((r,i)=>r.prevRank=i+1);
  rows.forEach(r=>r.rankMove=r.prevRank-r.rank);
  return {rows,total};
}
function sparklinePath(brandId, platformKey, currentPct){
  const p = PROFILES[brandId];
  const shape = platformKey==='ig' ? p.seriesIG : p.seriesYT;
  const pts = shape.slice(1).map(m=>currentPct*m);
  const mn = Math.min(...pts), mx = Math.max(...pts);
  const w=96,h=26,pad=3;
  const norm = v => mx===mn ? h/2 : h-pad-((v-mn)/(mx-mn))*(h-pad*2);
  return pts.map((v,i)=>`${(i/(pts.length-1))*w},${norm(v).toFixed(1)}`).join(' ');
}
function renderPlatformCard(platformKey, label, range, lens, metric){
  const {rows} = computePlatformRows(range, platformKey, lens, metric);
  const leader = rows[0];
  const client = rows.find(r=>r.isClient);
  const repBrandId = lens==='brand' ? client.id : 'kingfisher';
  const spark = sparklinePath(repBrandId, platformKey, client.pct);
  const moveTxt = client.rankMove>0?('▲'+client.rankMove):client.rankMove<0?('▼'+Math.abs(client.rankMove)):'—';
  const moveCls = client.rankMove>0?'up':client.rankMove<0?'down':'flat';
  return `<div class="card pf-card" data-nav="platform:${platformKey==='ig'?'instagram':'youtube'}">
    <div class="card-glow" style="background:radial-gradient(circle,var(--violet),transparent)"></div>

      <div><div class="bar-you" style="display:inline-block">YOU</div><div class="dim mono" style="font-size:10px;margin-top:2px">${esc(client.name.toUpperCase())} · ${fmtPct(client.pct,1)}</div></div>

/* ═══════════════════════════ PLATFORM INTELLIGENCE (page 2) ═══════════════════════════ */
function computePlatformDetailRows(range, platformKey, lens){
  const rows = [];
  if(lens==='brand'){
    Object.keys(BRANDS).forEach(id=>{
      const b=BRANDS[id], p=PROFILES[id], bd=p.windows[range][platformKey], e=p.engagement30;
      rows.push({id,name:b.name,color:b.color,isClient:b.isClient,organic:bd.organic,paid:bd.paid,total:bd.organic+bd.paid,
        posts:bd.posts,followers:bd.followers,engagement:e});
    });
  } else {
    Object.keys(PORTFOLIOS).forEach(pid=>{
      const po=PORTFOLIOS[pid]; let organic=0,paid=0,posts=0,followers=0;
      const eng={likes:0,comments:0,shares:0,saves:0};
      let sharesKnown=true, savesKnown=true;
      po.members.forEach(mid=>{
        const p=PROFILES[mid], bd=p.windows[range][platformKey], e=p.engagement30;
        organic+=bd.organic; paid+=bd.paid; posts+=bd.posts; followers+=(bd.followers||0);
        eng.likes+=e.likes||0; eng.comments+=e.comments||0;
        if(e.shares==null) sharesKnown=false; else eng.shares+=e.shares;
        if(e.saves==null) savesKnown=false; else eng.saves+=e.saves;
      });

function entityForDetail(id, type, range){
  if(type==='brand'){
    const b=BRANDS[id], p=PROFILES[id], bd=p.windows[range];
    return { id, type:'brand', name:b.name, color:b.color, isClient:b.isClient, handleIG:b.handleIG, handleYT:b.handleYT,
      ig:bd.ig, yt:bd.yt, engagement:p.engagement30, vehicleMix:p.vehicleMix, vehiclePrevMix:p.vehiclePrevMix,
      formatMix:p.formatMix, search:p.search, comments:deriveThemeMatrix(p),
      seriesIG:p.seriesIG, seriesYT:p.seriesYT, members:null };
  }
  const po = PORTFOLIOS[id];
  const ig={organic:0,paid:0,followers:0,posts:0}, yt={organic:0,paid:0,followers:0,posts:0};
  const engagement={likes:0,comments:0,shares:0,saves:0};
  let sharesKnown=true, savesKnown=true;
  const vehicleMix={}, vehiclePrevMix={}; VEHICLES.forEach(v=>{vehicleMix[v.id]=0;vehiclePrevMix[v.id]=0;});
  const matrix={}; THEMES.forEach(t=>matrix[t.id]={count:0,pos:0,neu:0,neg:0});
  let commentsRaw=0, commentsSpamW=0, weightTotal=0, dominant=null, domVal=-1;
  const searchAgg=[0,0,0,0,0,0];
  const seriesIGAgg=[0,0,0,0,0,0], seriesYTAgg=[0,0,0,0,0,0];
  po.members.forEach(mid=>{
    const p=PROFILES[mid], bd=p.windows[range];
    ['organic','paid','followers','posts'].forEach(k=>{ ig[k]+=bd.ig[k]||0; yt[k]+=bd.yt[k]||0; });
    const e = p.engagement30;
    engagement.likes+=e.likes||0; engagement.comments+=e.comments||0;
    if(e.shares==null) sharesKnown=false; else engagement.shares+=e.shares;
    if(e.saves==null) savesKnown=false; else engagement.saves+=e.saves;
    const weight = (bd.ig.organic||0)+(bd.ig.paid||0)+(bd.yt.organic||0)+(bd.yt.paid||0);
    weightTotal += weight;
    VEHICLES.forEach(v=>{ vehicleMix[v.id]+=p.vehicleMix[v.id]*weight; vehiclePrevMix[v.id]+=p.vehiclePrevMix[v.id]*weight; });
    const cm = deriveThemeMatrix(p);
    commentsRaw += cm.raw; commentsSpamW += cm.spamRate*cm.raw;
    THEMES.forEach(t=>{ const m=cm.matrix[t.id]; matrix[t.id].count+=m.count; matrix[t.id].pos+=m.pos*m.count; matrix[t.id].neu+=m.neu*m.count; matrix[t.id].neg+=m.neg*m.count; });
    p.search.forEach((v,i)=>searchAgg[i]+=v*weight);
    p.seriesIG.forEach((v,i)=>seriesIGAgg[i]+=v*weight);
    p.seriesYT.forEach((v,i)=>seriesYTAgg[i]+=v*weight);
    if(weight>domVal){ domVal=weight; dominant=mid; }
  });
  if(weightTotal) VEHICLES.forEach(v=>{ vehicleMix[v.id]/=weightTotal; vehiclePrevMix[v.id]/=weightTotal; });
  THEMES.forEach(t=>{ const c=matrix[t.id].count||1; matrix[t.id].pos/=c; matrix[t.id].neu/=c; matrix[t.id].neg/=c; });
  const search = weightTotal ? searchAgg.map(v=>v/weightTotal) : searchAgg;
  const seriesIG = weightTotal ? seriesIGAgg.map(v=>v/weightTotal) : seriesIGAgg;
  const seriesYT = weightTotal ? seriesYTAgg.map(v=>v/weightTotal) : seriesYTAgg;
  return { id, type:'group', name:po.name, color:po.color, isClient:!!po.isClient,
    ig, yt, engagement:{likes:engagement.likes,comments:engagement.comments,
      shares:sharesKnown?engagement.shares:null, saves:savesKnown?engagement.saves:null},
    vehicleMix, vehiclePrevMix, formatMix:PROFILES[dominant].formatMix,
    search, comments:{ raw:commentsRaw, spamRate: commentsRaw?commentsSpamW/commentsRaw:0, matrix },
    seriesIG, seriesYT, members:po.members };
}

function renderOutliers(entity, idx){
  const themes = Object.keys(entity.comments.matrix).map(k=>({id:k,...entity.comments.matrix[k]})).sort((a,b)=>b.neg-a.neg).slice(0,2);
  const rows = themes.map((t,i)=>{
    const label = THEMES.find(x=>x.id===t.id).label;
    const region = REGIONS[(idx+i)%REGIONS.length];
    const cap = OUTLIER_CAPTIONS[t.id].replace('{region}',region);
    return `<div class="outlier-row"><span class="ot">${label} — ${cap}</span><span class="og">${(t.neg*100).toFixed(0)}% NEG</span></div>`;
  }).join('');
  return `<div class="card chart-card">${rows}</div>`;

function headToHeadBlock(entity, range){

function parseHash(){
  const h = location.hash.replace(/^#\/?/,'');
  const parts = h.split('/').filter(Boolean);
  if(parts[0]==='platform' && parts[1]) return { page:'platform', platform:parts[1] };
  if(parts[0]==='brand' && parts[1] && BRANDS[parts[1]]) return { page:'brand', brandId:parts[1] };
  if(parts[0]==='group' && parts[1] && PORTFOLIOS[parts[1]]) return { page:'group', groupId:parts[1] };
  return { page:'overview' };
}
function syncHash(){
  let h = '#/overview';
  if(STATE.page==='platform') h = '#/platform/'+STATE.platform;
  else if(STATE.page==='brand') h = '#/brand/'+STATE.brandId;
  else if(STATE.page==='group') h = '#/group/'+STATE.groupId;
  if(location.hash===h) return;
  try{ history.pushState(null,'',h); }catch(err){ try{ location.hash = h; }catch(err2){} }
}

  $('#printFooter').innerHTML = `SOURCE — PUBLIC PLATFORM DATA · ${STATE.lens.toUpperCase()} LENS · ${RANGES[STATE.range].label} · UPDATED ${META.updated} · ESTIMATED VALUES MODELLED, NOT VERIFIED · SURROGATE-CLASSIFIED`;
}

function navigate(action){
  if(!action) return;
  const prevPage = STATE.page, prevPlatform = STATE.platform;
  if(action==='overview'){ STATE.page='overview'; STATE.fromPlatform=null; }
  else if(action.indexOf('platform:')===0){ STATE.page='platform'; STATE.platform=action.slice(9); STATE.fromPlatform=null; }
  else if(action.indexOf('brand:')===0){
    const id=action.slice(6); if(!BRANDS[id]) return;
    STATE.fromPlatform = prevPage==='platform' ? prevPlatform : (prevPage==='brand'||prevPage==='group'?STATE.fromPlatform:null);
    STATE.page='brand'; STATE.brandId=id;
  } else if(action.indexOf('group:')===0){
    const id=action.slice(6); if(!PORTFOLIOS[id]) return;
    STATE.fromPlatform = prevPage==='platform' ? prevPlatform : (prevPage==='brand'||prevPage==='group'?STATE.fromPlatform:null);
    STATE.page='group'; STATE.groupId=id;
  } else return;
  window.scrollTo(0,0);
  render();
}

function initTooltips(){
  const pop = $('#pop');
  let currentId = null;
  document.addEventListener('mouseover', e=>{
    const t = e.target.closest('[data-tip-id]');
    if(!t || t.dataset.tipId===currentId) return;
    currentId = t.dataset.tipId;
    const tip = TIP_REGISTRY[currentId];
    if(!tip) return;
    pop.innerHTML = `<div class="pt">${esc(tip.title)}</div>` + tip.lines.map(l=>`<p>${esc(l)}</p>`).join('');
    pop.classList.add('show');
  });
  document.addEventListener('mousemove', e=>{
    if(!pop.classList.contains('show')) return;
    let x = e.pageX+16, y = e.pageY+16;
    const h = pop.offsetHeight || 120;
    if(x+320 > window.scrollX+window.innerWidth) x = e.pageX-320-16;
    if(y+h > window.scrollY+window.innerHeight) y = e.pageY-h-16;
    pop.style.left = x+'px'; pop.style.top = y+'px';
  });
  document.addEventListener('mouseout', e=>{
    const t = e.target.closest('[data-tip-id]');
    if(!t) return;
    const related = e.relatedTarget;
    if(related && t.contains(related)) return;
    currentId = null; pop.classList.remove('show');
  });

/* ═══════════════════════════ BACKGROUND FIELD ═══════════════════════════ */
function fieldTriangles(size,width,height){
  size=size||48; width=width||1600; height=height||1000;
  var rh=size*Math.sqrt(3)/2;
  var rows=Math.ceil(height/rh)+2, cols=Math.ceil(width/size)+3;
  var out=[];
  for(var r=-1;r<rows;r++){
    var y0=r*rh,y1=(r+1)*rh,off=(r%2===0)?0:size/2;
    for(var c=-2;c<cols;c++){
      var x0=c*size+off;
      out.push(x0+","+y1+" "+(x0+size)+","+y1+" "+(x0+size/2)+","+y0);
      out.push((x0+size/2)+","+y0+" "+(x0+size*1.5)+","+y0+" "+(x0+size)+","+y1);
    }
  }
  return out;
}
function initBgField(){
  function build(){
    const w = window.innerWidth, h = window.innerHeight;
    const tris = fieldTriangles(48, w, h);
    const polys = tris.map(pts=>`<polygon points="${pts}"/>`).join('');
    $('#bgField').innerHTML = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="stroke:#7B6CF0;stroke-width:0.7;fill:none">${polys}</svg>`;
  }
  build();
  let t;
  window.addEventListener('resize', ()=>{ clearTimeout(t); t=setTimeout(build,200); });
}

        <div class="skeleton skeleton-line" style="width:55%"></div>
        <div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line"></div>
      </div>
    </div>
    <div class="platform-grid" style="margin-top:40px">
      <div class="skeleton-card"><div class="skeleton skeleton-line" style="height:80px"></div></div>
      <div class="skeleton-card"><div class="skeleton skeleton-line" style="height:80px"></div></div>
      <div class="skeleton-card"><div class="skeleton skeleton-line" style="height:80px"></div></div>
    </div>
  `;
}
function showDataError(err){
  $('#sidebar').innerHTML = renderSidebar();
  $('#topbar').innerHTML = renderTopbar();
  let lastKnown = null;
  try{ lastKnown = localStorage.getItem('ci_last_updated'); }catch(e){}
  const msg = (err && err.message) ? err.message : String(err);
  $('#view').innerHTML = `
    <div class="data-error-panel">
      <span class="eyebrow">CONNECTION</span>
      <h2 class="h2">DATA UNAVAILABLE</h2>
      <p>The dashboard could not load the latest pull. Nothing stale is being shown in its place.</p>
      ${lastKnown ? `<p>Last known good snapshot: <b style="color:var(--ink)">${esc(lastKnown)}</b></p>` : ''}
      <div class="derr-msg">${esc(msg)}</div>
    </div>
  `;
}

/* ═══════════════════════════ INIT (Phase 4e-ii) ═══════════════════════════ */
const DATA_URL = './data.json';

async function init(){
  initTooltips();
  bindGlobalEvents();
  try{ initBgField(); }catch(err){}
  showLoading();
  try{
    // build_demo.py (Phase 4f) injects this ahead of the fetch build's own
    // <script> when producing the offline dashboard-demo.html — same file,
    // same init(), just skips the network round-trip when data is already there.
    let d;
    if(window.__CI_INLINE_DATA__){
      d = window.__CI_INLINE_DATA__;
    } else {
      const res = await fetch(DATA_URL, { cache:'no-store' });
      if(!res.ok) throw new Error('HTTP '+res.status);
      d = await res.json();
    }
    BRANDS = d.brands; PROFILES = d.profiles;
    PORTFOLIOS = d.portfolios; UNTRACKED = d.untracked; META = d.meta;
    try{ localStorage.setItem('ci_last_updated', META.updated); }catch(e){}
  }catch(err){
    return showDataError(err);
  }
  Object.assign(STATE, parseHash());
  render();
}
window.addEventListener('popstate', ()=>{
  const prevPage = STATE.page, prevPlatform = STATE.platform;
  const route = parseHash();
  if(route.page!=='platform') route.fromPlatform = (prevPage==='platform') ? prevPlatform : null;
  Object.assign(STATE, route);
  render();
});
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
