name: CI daily pipeline

# 09:00 IST = 03:30 UTC. workflow_dispatch is always included so a run can
# be kicked off by hand — for the first real run after handles are verified,
# or to re-run a day that failed for an external reason.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

# Needed to commit store/ and public/ci/data.json back with the default token.
permissions:
  contents: write

concurrency:
  group: ci-daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      # Each step below exits non-zero on a `warn` or `error` pull_log status
      # (including a zero-record pull) — see RULES #6 in the build prompt.
      # GitHub Actions stops the job at the first failing step by default, so
      # a failure here means build_data and the commit step below never run:
      # a bad day never overwrites yesterday's good data.json (RULE #7).

      - name: Pull YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m pipeline.pull_youtube

      - name: Pull Instagram
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m pipeline.pull_instagram

      - name: Classify posts and comments
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m pipeline.classify

      - name: Build data.json
        run: python -m pipeline.build_data

      - name: Rebuild offline demo build
        run: python -m pipeline.build_demo

      - name: Commit and push
        run: |
          git config user.name "ci-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add store/ public/ci/data.json dashboard-demo.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "ci: daily data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
