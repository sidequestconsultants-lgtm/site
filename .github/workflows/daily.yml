name: CI daily pipeline

# 09:00 IST = 03:30 UTC. workflow_dispatch is always included so a run can
# be kicked off by hand — for the first real run after handles are verified,
# or to re-run a day that failed for an external reason.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

# Needed to commit store/ and public/ci/data.json back with the default token.
permissions:
  contents: write

concurrency:
  group: ci-daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      # Each script below exits non-zero only when NOT ONE brand succeeded
      # for that source ("error" — see each script's own status logic); a
      # partial success (some brands ok, some failed or hit an operational
      # limit like an Apify quota 403) is "warn" and exits 0, because
      # GitHub Actions stops the job at the first failing step by default
      # and a partial run's real, already-fetched rows must still reach
      # build_data and get committed, not be discarded along with the one
      # brand that failed.
      #
      # Pull YouTube stays a hard gate — it's the one source with no
      # external credit to exhaust, so its own total failure (zero brands)
      # is still treated as "nothing worth building today" and stops the
      # job before build_data/commit run (a bad day never overwrites
      # yesterday's good data.json, RULE #7). Pull Instagram and Classify
      # get `continue-on-error: true`: a fully exhausted Apify credit or a
      # dead Gemini key must not block the pipeline (build_data still runs
      # and builds data.json from whatever YouTube alone provided) — their
      # own scripts already log a `warn`/`error` pull_log row either way,
      # so nothing here is silent even when the step is allowed to fail.

      - name: Pull YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m pipeline.pull_youtube

      - name: Pull Instagram
        id: pull_instagram
        continue-on-error: true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m pipeline.pull_instagram

      - name: Classify posts and comments
        id: classify
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m pipeline.classify

      - name: Build data.json
        run: python -m pipeline.build_data

      - name: Rebuild offline demo build
        run: python -m pipeline.build_demo

      - name: Commit and push
        run: |
          git config user.name "ci-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add store/ public/ci/data.json dashboard-demo.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "ci: daily data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Record run summary
        if: always()
        run: |
          {
            echo "### Pipeline run summary"
            echo "- Pull Instagram: \`${{ steps.pull_instagram.outcome }}\`"
            echo "- Classify: \`${{ steps.classify.outcome }}\`"
            echo ""
            echo "Per-run detail (row counts, per-brand status, any quota/error messages) is in \`store/pull_log.json\`, committed above."
          } >> "$GITHUB_STEP_SUMMARY"
