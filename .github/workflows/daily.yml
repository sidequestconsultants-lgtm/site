name: CI daily pipeline

# 09:00 IST = 03:30 UTC. workflow_dispatch is always included so a run can
# be kicked off by hand — for the first real run after handles are verified,
# or to re-run a day that failed for an external reason.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

# Needed to commit store/ and public/ci/data.json back with the default token.
permissions:
  contents: write

concurrency:
  group: ci-daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      # ARCHITECTURE, not per-step tuning: no pull or classify script here
      # may ever exit non-zero for an expected condition (quota, rate
      # limit, a dead handle, zero rows, a missing API key) — each one
      # catches everything it can name, records the outcome in
      # store/pull_log.json, and exits 0 regardless (see each script's own
      # main()). `continue-on-error: true` below is defense in depth for
      # the one thing that CAN still exit non-zero: an unhandled crash —
      # a real bug, not a normal operating condition — and even then the
      # job must not stop, because build_data/commit run unconditionally
      # (`if: always()`) on whatever the store already has. Partial or
      # even entirely absent new data published beats a complete pipeline
      # run discarded; degradation is surfaced to the viewer via
      # meta.sources (build_data.py) instead of silently blocking
      # publication. There used to be an exception here for Pull YouTube
      # ("the one source with no external credit to exhaust, so its own
      # total failure blocks the build") — fifteen runs in a row proved
      # that exception itself was the recurring failure: one bad YouTube
      # API day (quota, a transient 5xx, a dead key) discarded a store
      # that already had real, taken-nowhere data sitting in it. There is
      # no remaining hard gate.

      - name: Pull YouTube
        id: pull_youtube
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m pipeline.pull_youtube

      - name: Pull Instagram
        id: pull_instagram
        continue-on-error: true
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m pipeline.pull_instagram

      - name: Classify posts and comments
        id: classify
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python -m pipeline.classify

      # Unconditional: runs even if every step above crashed outright.
      # build_data.py reads whatever is in store/ — yesterday's data if
      # nothing new landed, today's partial data if some of it did — and
      # its own validate() is the real, structural gate against publishing
      # something malformed (RULE 7); it is not gated on any pull having
      # succeeded.
      - name: Build data.json
        if: always()
        run: python -m pipeline.build_data

      - name: Rebuild offline demo build
        if: always()
        run: python -m pipeline.build_demo

      # Unconditional, and resilient to losing a race with another
      # workflow run (this one re-triggered, or weekly-trends.yml) that
      # pushed to main between this job's checkout and this step — both
      # touch public/ci/data.json/dashboard-demo.html/store/pull_log.json.
      # A bare `git push` here used to die on that rejection and throw
      # away the commit it had just made, taken nowhere, exactly like an
      # upstream script failure — this retries fetch+rebase onto whatever
      # is now at HEAD and pushes again rather than giving up on the first
      # collision.
      - name: Commit and push
        if: always()
        run: |
          git config user.name "ci-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add store/ public/ci/data.json dashboard-demo.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "ci: daily data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          attempt=0
          max_attempts=5
          until git push; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::git push failed after $max_attempts attempts — see the rejection above."
              exit 1
            fi
            echo "push rejected (attempt $attempt/$max_attempts) — another run landed first. Rebasing onto origin/$GITHUB_REF_NAME and retrying..."
            sleep $((attempt * 3))
            git fetch origin "$GITHUB_REF_NAME"
            if ! git rebase "origin/$GITHUB_REF_NAME"; then
              # The two workflows only really collide on files each fully
              # regenerates (data.json/demo/pull_log) or two same-day
              # snapshots — a real textual conflict past that point isn't
              # something a script should guess how to resolve. Leave the
              # repo in a clean state and fail loudly for a human, rather
              # than pushing a half-merged store.
              git rebase --abort
              echo "::error::rebase onto origin/$GITHUB_REF_NAME conflicted — needs manual resolution."
              exit 1
            fi
          done

      - name: Record run summary
        if: always()
        run: python -m pipeline.run_summary >> "$GITHUB_STEP_SUMMARY"
